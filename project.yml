name: Reprise
options:
  bundleIdPrefix: dev.nikiomori
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  # XcodeGen doesn't know Icon Composer files yet; tell Xcode to compile it with actool.
  postGenCommand: sed -i '' 's/lastKnownFileType = wrapper.icon/lastKnownFileType = folder.iconcomposer.icon/' Reprise.xcodeproj/project.pbxproj
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "7"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    # Apple silicon only: the Intel slice was a quarter of the download.
    ARCHS: arm64
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # The icon's bitmaps zipped rather than LZFSE'd, losslessly both: 200 KB less in the app.
    ASSETCATALOG_COMPILER_OPTIMIZATION: space
targets:
  Reprise:
    type: application
    platform: macOS
    sources:
      - path: Reprise
    dependencies:
      # VideoPlayer lives in _AVKit_SwiftUI, which doesn't load AVKit itself;
      # without an explicit link the player view's superclass is missing at runtime.
      - sdk: AVKit.framework
      - target: RepriseControls
    info:
      path: Reprise/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSHumanReadableCopyright: MIT License
        NSMicrophoneUsageDescription: Reprise records your voice during the calls you choose to record.
        NSAudioCaptureUsageDescription: Reprise records what the other people on the call say.
        NSCalendarsFullAccessUsageDescription: Reprise names each call after the calendar event it belongs to.
    entitlements:
      path: Reprise/Resources/Reprise.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nikiomori.reprise
        PRODUCT_NAME: Reprise
    scheme:
      testTargets: [RepriseTests]
  # The Record control in Control Center and the menu bar.
  RepriseControls:
    type: app-extension
    platform: macOS
    sources:
      - path: RepriseControls
      - path: Reprise/App/RecordingControl.swift
    info:
      path: RepriseControls/Info.plist
      properties:
        CFBundleDisplayName: Reprise
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: RepriseControls/RepriseControls.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nikiomori.reprise.controls
        PRODUCT_NAME: RepriseControls
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) CONTROLS
  RepriseTests:
    type: bundle.unit-test
    platform: macOS
    sources: [RepriseTests]
    dependencies:
      - target: Reprise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Reprise.app/Contents/MacOS/Reprise
