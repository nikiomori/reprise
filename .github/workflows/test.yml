name: Test

on: [push, pull_request]

jobs:
  test:
    # Reprise needs Xcode 27; macos-26 tops out at Xcode 26.6, whose Swift 6.2 can't type-check it.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -project Reprise.xcodeproj -scheme Reprise -destination 'platform=macOS,arch=arm64' test
